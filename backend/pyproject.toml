[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resource-navigator-backend"
version = "0.1.0"
description = "FastAPI + LangGraph backend for the Community Resource Navigator MVP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=1.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    # Gemini SDK. Imported only when LLM_MODE=live.
    "google-genai>=3.3",
    # Optional document upload (T17).
    "python-multipart>=0.0.20",
    "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
